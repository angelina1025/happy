      if (!dateVal) return '2026-10-14 08:30';
      const str = String(dateVal);
      if (str.startsWith('Date(') && str.endsWith(')')) {
        const parts = str.substring(5, str.length - 1).split(',');
        const y = parts[0];
        const m = String(Number(parts[1]) + 1).padStart(2, '0');
        const d = String(parts[2]).padStart(2, '0');
        const h = parts[3] ? String(parts[3]).padStart(2, '0') : '00';
        const min = parts[4] ? String(parts[4]).padStart(2, '0') : '00';
        return `${y}-${m}-${d} ${h}:${min}`;

      return str;

      const num = parseFloat(str);
      if (!isNaN(num)) {

      return str;

    const fetchGvizJSONP = (sheetUrl, sheetName = '') => {
      return new Promise((resolve, reject) => {
        try {
          const idMatch = sheetUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
          if (!idMatch || !idMatch[1]) {
            return reject(new Error('無法識別 Google 試算表 ID，請確認網址格式！'));
          }
          const spreadsheetId = idMatch[1];
          const callbackName = 'gvizCallback_' + Math.round(100000 * Math.random());
          let url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=responseHandler:${callbackName}`;
          if (sheetName) {
            url += `&sheet=${encodeURIComponent(sheetName)}`;
          }

          const script = document.createElement('script');
          script.src = url;

          const cleanup = () => {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
          };

          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error(`連線超時，請確認試算表共用設定已開啟「知道連結的任何人均為檢視/編輯者」！`));
          }, 8000);

          window[callbackName] = (response) => {
            clearTimeout(timeout);
            cleanup();
            if (response && response.status === 'error') {
              reject(new Error(response.errors?.[0]?.detailed_message || 'Google 拒絕讀取'));
            } else {
              resolve(response.table);
            }
          };

          script.onerror = () => {
            clearTimeout(timeout);
            cleanup();
            reject(new Error('網路請求失敗，請確認試算表已開啟公開檢視權限。'));
          };

          document.body.appendChild(script);
        } catch (e) {
          reject(e);
        }
      });
    };

        setCurrentUser(null);
        setCurrentView('login');
        showToast('已安全登出系統', 'info');
      };

      useEffect(() => {
        let timer = null;
        if (currentView === 'active-exam' && !isExamSubmitted && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timer);
                handleExecuteSubmission('time-up');
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [currentView, isExamSubmitted, timeLeft]);

      const handleStartExam = (examObj) => {
        const examQuestions = examObj.questions && examObj.questions.length > 0 
          ? examObj.questions 
          : questions.filter(q => examObj.questionIds.includes(q.id));

        if (examQuestions.length === 0) {
          showToast('此試卷目前無可用試題！', 'error');
          return;
        }
        setActiveExam({ ...examObj, questions: examQuestions });
        setExamAnswers({});
        setTimeLeft((examObj.timeLimitMinutes || 15) * 60);
        setIsExamSubmitted(false);
        setCurrentView('active-exam');
      };

      const handleExecuteSubmission = (submissionType = 'manual') => {
        if (isExamSubmitted || !activeExam) return;
        setIsExamSubmitted(true);

        const activeQs = activeExam.questions;
        let earnedScore = 0;
        let totalPossible = 0;
        let correctCount = 0;

        activeQs.forEach(q => {
          const pts = q.points || 10;
          totalPossible += pts;
          if (examAnswers[q.id] === q.correctAnswer) {
            earnedScore += pts;
            correctCount += 1;
          }
        });

        const accuracy = activeQs.length > 0 ? Math.round((correctCount / activeQs.length) * 100) : 0;
        const timeSpentSec = ((activeExam.timeLimitMinutes || 15) * 60) - timeLeft;
        const mins = Math.max(0, Math.floor(timeSpentSec / 60));
        const secs = Math.max(0, timeSpentSec % 60);

        const resultRecord = {
          id: 'hist-' + Date.now(),
          examTitle: activeExam.title,
          studentName: currentUser?.name || '學員',
          date: new Date().toLocaleString('zh-TW', { hour12: false }),
          score: earnedScore,
          totalPoints: totalPossible,
          accuracyRate: `${accuracy}%`,
          userAnswers: { ...examAnswers },
          questionSnapshots: activeQs,
          timeSpent: `${mins < 10 ? '0' + mins : mins}分${secs < 10 ? '0' + secs : secs}秒`
        };

        setExamHistory(prev => [resultRecord, ...prev]);
        setLastFinishedResult(resultRecord);
        setCurrentView('exam-result');
        showToast(submissionType === 'time-up' ? '測驗時間已到，系統自動交卷！' : '考試已提交！系統已完成即時自動批改。', 'success');
      };

      const handlePracticeWrong = (resultObj) => {
        const wrongQs = (resultObj.questionSnapshots || []).filter(q => resultObj.userAnswers[q.id] !== q.correctAnswer);
        if (wrongQs.length === 0) {
          showToast('太棒了！此份測驗全對，無錯題需要練習。', 'info');
          return;
        }
        const practiceExam = {
          id: 'practice-' + Date.now(),
          title: `錯題診斷強化練習 - ${resultObj.examTitle}`,
          description: `針對前次測驗的 ${wrongQs.length} 題錯誤題目進行專屬強化練習`,
          timeLimitMinutes: Math.max(3, wrongQs.length * 2),
          questionIds: wrongQs.map(q => q.id),
          questions: wrongQs,
          category: '錯題專案',
          totalPoints: wrongQs.reduce((sum, q) => sum + (q.points || 10), 0)
        };
        setActiveExam(practiceExam);
        setExamAnswers({});
        setTimeLeft(practiceExam.timeLimitMinutes * 60);
        setIsExamSubmitted(false);
        setCurrentView('active-exam');
        showToast('已開啟錯題再次練習！', 'info');
      };

      const handleFetchCloudSheet = async (customUrl) => {
        const urlToFetch = (customUrl || googleSheetsUrl || '').trim();
        if (!urlToFetch) {
          showToast('請先貼上 Google 試算表連結！', 'error');
          return;
        }

        showToast('正在連線 Google 雲端試算表讀取資料...', 'info');

        try {
          let wrongTable = null;
          const candidateWrongNames = ['錯題', '分頁一', '工作表1', 'Sheet1', ''];
          for (const sName of candidateWrongNames) {
            try {
              wrongTable = await fetchGvizJSONP(urlToFetch, sName);
              if (wrongTable && wrongTable.rows && wrongTable.rows.length > 0) break;
            } catch (err) {}
          }

          let scoreTable = null;
          const candidateScoreNames = ['成績', '分頁二', '工作表2', 'Sheet2'];
          for (const sName of candidateScoreNames) {
            try {
              scoreTable = await fetchGvizJSONP(urlToFetch, sName);
              if (scoreTable && scoreTable.rows && scoreTable.rows.length > 0) break;
            } catch (err) {}
          }

          if (!wrongTable && !scoreTable) {
            throw new Error('無法讀取試算表，請確認已設為「知道連結的任何人均為檢視/編輯者」！');
          }

          const parsedWrongQs = [];
          if (wrongTable && wrongTable.rows) {
            wrongTable.rows.forEach((row, i) => {
              const cells = row.c || [];
              const rawTitle = cells[2]?.v || cells[1]?.v || '';
              if (!rawTitle || String(rawTitle).includes('本次測驗全對') || String(rawTitle).includes('題目內容')) return;

              const cleanTitle = String(rawTitle).replace(/^[0-9]+\.\s*/, '');
              let userAns = cells[3]?.v || '';
              let correctAns = cells[4]?.v || '';
              let explanation = cells[5]?.v || '雲端錯題記錄';

              parsedWrongQs.push({
                id: `cloud-wrong-q-${i + 1}-${Date.now()}`,
                categoryId: 'cat-cloud',
                categoryName: '雲端錯題',
                title: cleanTitle,
                options: ['選項 A', '選項 B', '選項 C', '選項 D'],
                correctAnswer: 0,
                points: 10,
                explanation: String(explanation),
                rawUserAns: String(userAns),
                rawCorrectAns: String(correctAns)
              });
            });
          }

          const parsedScores = [];
          if (scoreTable && scoreTable.rows) {
            scoreTable.rows.forEach((row, i) => {
              const cells = row.c || [];
              const rawDate = cells[1]?.f || cells[1]?.v;
              const examName = cells[2]?.v;
              if (!examName || String(examName).includes('測驗試卷')) return;

              const score = cells[3]?.v !== undefined ? Number(cells[3]?.v) : 0;
              const totalPoints = cells[4]?.v !== undefined ? Number(cells[4]?.v) : 100;
              const accuracyRate = cells[5]?.v !== undefined ? formatAccuracyRate(cells[5]?.v) : '0%';

              const newRecord = {
                id: `cloud-hist-${Date.now()}-${i}`,
                examTitle: `[雲端] ${examName}`,
                studentName: cells[0]?.v || '檢定學員',
                date: formatGvizDate(rawDate),
                score: score,
                totalPoints: totalPoints,
                accuracyRate: accuracyRate,
                userAnswers: {},
                questionSnapshots: [],
                timeSpent: cells[6]?.v || '約 10 分鐘'
              };
              parsedScores.push(newRecord);
            });
          }

          if (parsedScores.length > 0) {
            setExamHistory(prev => [...parsedScores, ...prev]);
          }

          setCloudLoadedData({
            examTitle: `Google 雲端錯題特訓卷 (${new Date().toLocaleDateString()})`,
            questions: parsedWrongQs,
            scores: parsedScores
          });

          setCurrentView('cloud-review');
          showToast(`成功抓取！載入 ${parsedWrongQs.length} 題錯題與 ${parsedScores.length} 筆歷史成績，請先審閱確認。`, 'success');

        } catch (err) {
          console.error(err);
          showToast(err.message || '連線讀取 Google 試算表失敗，請檢查網址或權限！', 'error');
        }
      };

      if (!isLoggedIn || currentView === 'login') {
        return <LoginView usersList={usersList} onLogin={handleLogin} />;
      }

      return (
        <div className="min-h-screen w-full flex flex-col bg-slate-100 text-xs">
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-lg shadow-2xl text-white font-bold flex items-center space-x-2 border transition ${
              toast.type === 'error' ? 'bg-rose-600 border-rose-700' : toast.type === 'success' ? 'bg-emerald-600 border-emerald-700' : 'bg-blue-600 border-blue-700'
            }`}>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Top Status Bar */}
          <header className="bg-slate-900 text-slate-200 px-4 py-2.5 flex items-center justify-between border-b border-slate-700 shadow-sm shrink-0">
            <div className="flex items-center space-x-2 font-bold text-xs sm:text-sm tracking-wide">

              <span className="hidden md:inline text-slate-400 font-normal">

            </div>
            <div className="flex items-center space-x-2 sm:space-x-3 text-[11px]">

              <button

                <Icon name="logout" className="w-3.5 h-3.5" />
                <span>登出</span>
              </button>

          </header>

          <div className="flex-1 flex flex-col md:flex-row overflow-hidden">

              </button>

              {currentUser?.role !== 'ADMIN' && (
                <button

                    currentView === 'custom-bank' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  <Icon name="upload" />
                  <span>自訂題庫區 (Excel/雲端)</span>
                </button>
              )}

              {currentUser?.role !== 'ADMIN' && (
                <button

                  className={`w-full text-left px-3 py-2.5 rounded-lg font-bold flex items-center space-x-2 transition cursor-pointer ${
                    currentView === 'learning-history' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  <Icon name="chart" />
                  <span>個人成績與試算表</span>
                </button>
              )}

              {currentUser?.role === 'ADMIN' && (
                <button
                  onClick={() => setCurrentView('admin-panel')}
                  className={`w-full text-left px-3 py-2.5 rounded-lg font-bold flex items-center space-x-2 transition cursor-pointer ${
                    currentView === 'admin-panel' ? 'bg-purple-700 text-white shadow-md' : 'text-purple-300 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  <Icon name="cog" />
                  <span>帳號管理中心 (CRUD)</span>
                </button>
              )}
            </aside>

            <main className="flex-1 overflow-y-auto p-3 sm:p-5 bg-slate-100 flex flex-col">
              {currentView === 'graphical-menu' && (
                <GraphicalMenuView
                  currentUser={currentUser}
                  processTab={processTab}
                  onSetProcessTab={setProcessTab}
                  onNavigate={setCurrentView}
                  categories={categories}
                  exams={exams}
                  questions={questions}
                  onStartExam={handleStartExam}
                  history={examHistory}
                  onPracticeWrong={handlePracticeWrong}
                  onFetchCloudSheet={handleFetchCloudSheet}
                  lastFinishedResult={lastFinishedResult}
                  onSetLastFinishedResult={setLastFinishedResult}
                  showToast={showToast}
                />
              )}

              {currentView === 'online-bank' && (
                <QuestionBankView
                  categories={categories}
                  questions={questions}
                  exams={exams}
                  currentUser={currentUser}
                  onAddQuestion={(q) => setQuestions([q, ...questions])}
                  onUpdateQuestion={(uq) => setQuestions(questions.map(q => q.id === uq.id ? uq : q))}
                  onDeleteQuestion={(qid) => setQuestions(questions.filter(q => q.id !== qid))}
                  onAddCategory={(cat) => setCategories([...categories, cat])}
                  onStartExam={handleStartExam}
                  onAddExam={(newEx) => setExams([newEx, ...exams])}
                  onUpdateExam={(uex) => setExams(exams.map(e => e.id === uex.id ? uex : e))}
                  onDeleteExam={(eid) => setExams(exams.filter(e => e.id !== eid))}
                  showToast={showToast}
                />
              )}

              {currentView === 'custom-bank' && (
                <CustomBankView
                  currentUser={currentUser}
                  onStartExam={handleStartExam}
                  onNavigate={setCurrentView}
                  googleSheetsUrl={googleSheetsUrl}
                  onUpdateSheetUrl={handleUpdateSheetUrl}
                  onFetchCloudSheet={handleFetchCloudSheet}
                  showToast={showToast}
                />
              )}

              {currentView === 'cloud-review' && cloudLoadedData && (
                <CloudReviewView
                  data={cloudLoadedData}
                  onStartPractice={() => {
                    handleStartExam({
                      id: 'exam-cloud-' + Date.now(),
                      title: cloudLoadedData.examTitle,
                      description: `從 Google 雲端載入之錯題診斷特訓卷 (共 ${cloudLoadedData.questions.length} 題)`,
                      timeLimitMinutes: Math.max(5, cloudLoadedData.questions.length * 2),
                      questions: cloudLoadedData.questions,
                      totalPoints: cloudLoadedData.questions.length * 10,
                      category: '雲端錯題特訓'
                    });
                  }}
                  onCancel={() => setCurrentView('custom-bank')}
                />
              )}

              {currentView === 'active-exam' && activeExam && (
                <ActiveExamView
                  exam={activeExam}
                  answers={examAnswers}
                  timeLeft={timeLeft}
                  onSelectOption={(qId, optIdx) => setExamAnswers({ ...examAnswers, [qId]: optIdx })}
                  onSubmit={() => handleExecuteSubmission('manual')}
                />
              )}

              {currentView === 'exam-result' && (
                lastFinishedResult ? (
                  <ExamResultView
                    result={lastFinishedResult}
                    currentUser={currentUser}
                    googleSheetsUrl={googleSheetsUrl}
                    onUpdateSheetUrl={handleUpdateSheetUrl}
                    onRetryExam={() => handleStartExam(activeExam)}
                    onPracticeWrong={() => handlePracticeWrong(lastFinishedResult)}
                    onGoNav={() => setCurrentView('graphical-menu')}
                    showToast={showToast}
                  />
                ) : (
                  <div className="max-w-md mx-auto my-12 bg-white p-6 rounded-2xl border border-slate-300 shadow-md text-center space-y-4">
                    <div className="w-14 h-14 mx-auto rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-2xl font-bold shadow-inner">
                      ⚠️
                    </div>
                    <div className="space-y-1">
                      <h3 className="font-bold text-slate-800 text-base">尚未有任何測驗紀錄</h3>
                      <p className="text-xs text-slate-500 leading-relaxed">
                        您必須先完成至少一次檢定測驗並提交交卷，系統才會在此處展示即時自動批改成果、錯題診斷與 Google 試算表寫入功能。
                      </p>
                    </div>
                    <div className="pt-2 flex justify-center space-x-2">
                      <button
                        onClick={() => setCurrentView('graphical-menu')}
                        className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg text-xs cursor-pointer transition"
                      >
                        返回流程選單
                      </button>
                      <button
                        onClick={() => setCurrentView('online-bank')}
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-xs shadow cursor-pointer transition flex items-center space-x-1"
                      >
                        <Icon name="play" className="w-3.5 h-3.5" />
                        <span>前往挑選試卷測驗</span>
                      </button>
                    </div>

              )}

              {currentView === 'learning-history' && (
                <LearningHistoryView
                  history={examHistory}
                  currentUser={currentUser}
                  onPracticeWrong={handlePracticeWrong}
                />
              )}

              {currentView === 'admin-panel' && (
                <AdminPanelView
                  questions={questions}
                  categories={categories}
                  usersList={usersList}
                  currentUser={currentUser}
                  onAddUser={(nu) => setUsersList([...usersList, nu])}
                  onUpdateUser={(uu) => setUsersList(usersList.map(u => u.id === uu.id ? uu : u))}
                  onDeleteUser={(uid) => {
                    if (currentUser?.id === uid) return showToast('無法刪除目前正在登入中的帳號！', 'error');
                    setUsersList(usersList.filter(u => u.id !== uid));
                    showToast('帳號已從系統移除！', 'info');
                  }}
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    function QuestionBankView({
      categories,
      questions,
      exams,
      currentUser,
      onAddQuestion,
      onUpdateQuestion,
      onDeleteQuestion,
      onAddCategory,
      onStartExam,
      onAddExam,
      onUpdateExam,
      onDeleteExam,
      showToast
    }) {
      const isAdmin = currentUser?.role === 'ADMIN';

      const [yearFilter, setYearFilter] = useState('ALL');
      const [categoryFilter, setCategoryFilter] = useState('ALL');
      const [searchTerm, setSearchTerm] = useState('');
      const [isFuzzy, setIsFuzzy] = useState(false);
      const [sortBy, setSortBy] = useState('relevant');
      const [bookmarkedIds, setBookmarkedIds] = useState({});
      const [expandedExamId, setExpandedExamId] = useState(null);

      // Exam Modal
      const [showExamModal, setShowExamModal] = useState(false);
      const [editingExam, setEditingExam] = useState(null);
      const [examTitle, setExamTitle] = useState('');
      const [examYear, setExamYear] = useState('115年');
      const [examCategory, setExamCategory] = useState(categories[0]?.name || '前端網頁開發');
      const [isCreatingNewExamCat, setIsCreatingNewExamCat] = useState(false);
      const [newExamCatInput, setNewExamCatInput] = useState('');
      const [examTimeLimit, setExamTimeLimit] = useState(15);
      const [examSelectedQIds, setExamSelectedQIds] = useState([]);
      const [examQSearch, setExamQSearch] = useState('');
      const [examQCatFilter, setExamQCatFilter] = useState('ALL');

      // Question Modal
      const [showQuestionModal, setShowQuestionModal] = useState(false);
      const [editingQuestion, setEditingQuestion] = useState(null);
      const [qTitle, setQTitle] = useState('');
      const [qCatId, setQCatId] = useState(categories[0]?.id || 'cat-1');
      const [qOpt0, setQOpt0] = useState('');
      const [qOpt1, setQOpt1] = useState('');
      const [qOpt2, setQOpt2] = useState('');
      const [qOpt3, setQOpt3] = useState('');
      const [qCorrect, setQCorrect] = useState(0);
      const [qPoints, setQPoints] = useState(10);
      const [qExplanation, setQExplanation] = useState('');
      const [isNewCatMode, setIsNewCatMode] = useState(false);
      const [newCatName, setNewCatName] = useState('');

      const adminExcelInputRef = useRef(null);

      const handleAdminExcelImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet);

            if (!rows || rows.length === 0) {
              showToast('Excel 檔案內無任何題目資料！', 'error');
              return;
            }

            let importCount = 0;
            rows.forEach((r, i) => {
              const options = [
                String(r['選項A'] || r['選項 A'] || r['A'] || ''),
                String(r['選項B'] || r['選項 B'] || r['B'] || ''),
                String(r['選項C'] || r['選項 C'] || r['C'] || ''),
                String(r['選項D'] || r['選項 D'] || r['D'] || '')
              ];

              const correctRaw = String(r['正確答案'] || r['答案'] || 'A').trim().toUpperCase();
              let correctIdx = 0;
              if (correctRaw === 'B' || correctRaw === '1') correctIdx = 1;
              else if (correctRaw === 'C' || correctRaw === '2') correctIdx = 2;
              else if (correctRaw === 'D' || correctRaw === '3') correctIdx = 3;

              const catName = String(r['題目分類'] || '一般綜合試題').trim();
              let matchedCat = categories.find(c => c.name === catName);
              if (!matchedCat) {
                matchedCat = { id: 'cat-' + Date.now() + '-' + i, name: catName, description: 'Excel 匯入自動建立' };
                onAddCategory(matchedCat);
              }

              const newQ = {
                id: `q-import-${Date.now()}-${i}`,
                categoryId: matchedCat.id,
                categoryName: catName,
                title: String(r['題目內容'] || r['題目'] || `第 ${i + 1} 題未命名題目`),
                options,
                correctAnswer: correctIdx,
                points: Number(r['配分'] || 10),
                explanation: String(r['題目解析'] || r['詳解'] || '無額外解析')
              };
              onAddQuestion(newQ);
              importCount++;
            });

            showToast(`🎉 成功透過 Excel 批次匯入 ${importCount} 道題目至題庫！`, 'success');
            if (adminExcelInputRef.current) adminExcelInputRef.current.value = '';
          } catch (err) {
            console.error(err);
            showToast('解析 Excel 失敗，請確認檔案格式是否正確！', 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const toggleBookmark = (id) => {
        setBookmarkedIds(prev => {
          const next = { ...prev, [id]: !prev[id] };
          showToast(next[id] ? '已加入試卷收藏夾' : '已從收藏夾移除', 'info');
          return next;
        });
      };

      const handleOpenExamModal = (ex = null) => {
        if (ex) {
          setEditingExam(ex);
          setExamTitle(ex.title);
          setExamYear(ex.year || '115年');
          setExamCategory(ex.category || categories[0]?.name || '前端網頁開發');
          setIsCreatingNewExamCat(false);
          setNewExamCatInput('');
          setExamTimeLimit(ex.timeLimitMinutes || 15);
          setExamSelectedQIds(ex.questionIds || []);
        } else {
          setEditingExam(null);
          setExamTitle('');
          setExamYear('115年');
          setExamCategory(categories[0]?.name || '前端網頁開發');
          setIsCreatingNewExamCat(false);
          setNewExamCatInput('');
          setExamTimeLimit(15);

          const matchedQ = questions.find(q => q.id === qId);
          return sum + (matchedQ?.points || 10);
        }, 0);

        if (editingExam) {
          onUpdateExam({
            ...editingExam,
            title: examTitle,
            year: examYear,
            category: targetCategory,

            category: targetCategory,

          setQOpt3(q.options[3] || '');

          setQPoints(q.points || 10);
          setQExplanation(q.explanation || '');

          setQCatId(categories[0]?.id || 'cat-1');

          setQExplanation('');

        const qPayload = {

          categoryId: finalCatId,
          categoryName: finalCatName,
          title: qTitle,
          options: [qOpt0, qOpt1, qOpt2, qOpt3],

            matchSearch = isFuzzy

          return matchYear && matchCat && matchSearch;

    function CustomBankView({
      currentUser,
      onStartExam,
      onNavigate,
      googleSheetsUrl,
      onUpdateSheetUrl,
      onFetchCloudSheet,
      showToast
    }) {
      const [customExamTitle, setCustomExamTitle] = useState('我的 Excel 自訂檢定測驗');
      const [customTimeLimit, setCustomTimeLimit] = useState(15);
      const [excelParsedExam, setExcelParsedExam] = useState(null);
      const fileInputRef = useRef(null);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet);

            if (!rows || rows.length === 0) {
              showToast('Excel 檔案內無任何題目資料！', 'error');
              return;
            }

            const parsedQuestions = rows.map((r, i) => {
              const options = [
                String(r['選項A'] || r['選項 A'] || r['A'] || ''),
                String(r['選項B'] || r['選項 B'] || r['B'] || ''),
                String(r['選項C'] || r['選項 C'] || r['C'] || ''),
                String(r['選項D'] || r['選項 D'] || r['D'] || '')
              ];

              const correctRaw = String(r['正確答案'] || r['答案'] || 'A').trim().toUpperCase();
              let correctIdx = 0;
              if (correctRaw === 'B' || correctRaw === '1') correctIdx = 1;
              else if (correctRaw === 'C' || correctRaw === '2') correctIdx = 2;
              else if (correctRaw === 'D' || correctRaw === '3') correctIdx = 3;

              return {
                id: `excel-q-${i + 1}-${Date.now()}`,
                categoryId: 'cat-excel',
                categoryName: String(r['題目分類'] || 'Excel 自選題庫'),
                title: String(r['題目內容'] || r['題目'] || `第 ${i + 1} 題未命名題目`),
                options,
                correctAnswer: correctIdx,
                points: Number(r['配分'] || 10),
                explanation: String(r['題目解析'] || r['詳解'] || '無額外解析')
              };
            });

            const newCustomExam = {
              id: 'custom-excel-' + Date.now(),
              title: customExamTitle || file.name.replace(/\.[^/.]+$/, ""),
              description: `學員自訂上傳之試題 (來自檔案: ${file.name}，共 ${parsedQuestions.length} 題)`,
              timeLimitMinutes: Number(customTimeLimit) || 15,
              questions: parsedQuestions,
              questionIds: parsedQuestions.map(q => q.id),
              category: 'Excel 自訂試卷',
              totalPoints: parsedQuestions.reduce((sum, q) => sum + q.points, 0)
            };

            setExcelParsedExam(newCustomExam);
            showToast(`成功解析 Excel 試卷！共匯入 ${parsedQuestions.length} 題。`, 'success');
          } catch (err) {
            console.error(err);
            showToast('讀取 Excel 失敗，請確認是否符合範本格式！', 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      return (
        <div className="space-y-4 max-w-5xl mx-auto w-full">
          <div className="bg-white p-4 rounded-xl border border-slate-300 flex items-center justify-between shadow-xs">
            <div>
              <h2 className="font-bold text-slate-800 text-sm">自訂題庫區</h2>
              <p className="text-[11px] text-slate-500">支援「上傳本機 Excel 題庫」或「免傳檔案連線 Google 雲端試算表錯題」進行彈性檢定練習</p>
            </div>
          </div>

          {/* Section 1: Local Excel Upload */}
          <div className="bg-white p-5 rounded-xl border border-slate-300 space-y-4 shadow-xs">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b pb-3">
              <div>
                <h3 className="font-bold text-slate-800 text-sm">自選 Excel 試題檔線上測驗</h3>
                <p className="text-[11px] text-slate-500">支援 .xlsx 與 .xls 試題檔，即傳即測，測驗結束亦可一鍵同步至 Google 試算表</p>
              </div>
              <button
                onClick={downloadExcelTemplate}
                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded font-bold text-xs flex items-center space-x-1 cursor-pointer"
              >
                <Icon name="download" />
                <span>下載 Excel 題目固定格式範本</span>
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label className="block font-bold text-slate-700 mb-1 text-xs">設定自訂測驗名稱：</label>
                <input
                  type="text"
                  value={customExamTitle}
                  onChange={(e) => setCustomExamTitle(e.target.value)}
                  placeholder="請輸入本次測驗名稱"
                  className="w-full p-2 border border-slate-300 rounded text-xs"
                />
              </div>
              <div>
                <label className="block font-bold text-slate-700 mb-1 text-xs">設定測驗時間限制 (分鐘)：</label>
                <input
                  type="number"
                  min="1"
                  value={customTimeLimit}
                  onChange={(e) => setCustomTimeLimit(e.target.value)}
                  className="w-full p-2 border border-slate-300 rounded text-xs"
                />
              </div>
            </div>

            <div
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              className="border-2 border-dashed border-emerald-300 hover:border-emerald-500 bg-emerald-50/40 p-6 rounded-xl text-center cursor-pointer transition space-y-2"
            >
              <div className="flex justify-center text-emerald-600">
                <Icon name="upload" className="w-8 h-8" />
              </div>
              <p className="font-bold text-slate-700 text-xs">點擊此處選擇或拖曳 Excel 題庫檔案 (.xlsx, .xls)</p>
              <p className="text-[10px] text-slate-500">標準欄位：題目分類、題目內容、選項A、選項B、選項C、選項D、正確答案(A/B/C/D)、配分、題目解析</p>
              <input
                type="file"
                ref={fileInputRef}
                accept=".xlsx, .xls"
                onChange={handleFileUpload}
                className="hidden"
              />
            </div>

            {excelParsedExam && (
              <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-300 flex items-center justify-between">
                <div>
                  <span className="text-[10px] bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded font-bold">解析完成試卷</span>
                  <h4 className="font-bold text-slate-800 text-sm mt-1">{excelParsedExam.title}</h4>
                  <p className="text-[11px] text-slate-600">試卷題目總數：{excelParsedExam.questions.length} 題 | 試卷總分：{excelParsedExam.totalPoints} 分 | 限時：{excelParsedExam.timeLimitMinutes} 分鐘</p>
                </div>
                <button
                  onClick={() => onStartExam(excelParsedExam)}
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg shadow transition flex items-center space-x-1 cursor-pointer"
                >
                  <Icon name="play" />
                  <span>立刻以此 Excel 開始測驗</span>
                </button>
              </div>
            )}
          </div>

          {/* Section 2: Cloud Google Sheets Sync */}
          <div className="bg-white p-5 rounded-xl border-2 border-blue-400 space-y-3.5 shadow-sm">
            <div className="flex items-center space-x-2 border-b pb-2.5">
              <span className="p-2 bg-blue-600 text-white rounded-lg">
                <Icon name="cloud" className="w-5 h-5" />
              </span>
              <div>
                <h3 className="font-bold text-slate-800 text-sm">連線 Google 雲端試算表錯題 (免上傳檔案)</h3>
                <p className="text-[11px] text-slate-500">直接讀取 Google 雲端試算表中的「錯題 (分頁一)」與「成績 (分頁二)」</p>
              </div>
            </div>

            <div className="space-y-2">
              <label className="block font-bold text-slate-700 text-xs">貼上您的 Google 試算表共用連結 (需設為任何人可檢視/編輯)：</label>
              <div className="flex flex-col sm:flex-row gap-2">
                <input
                  type="text"
                  placeholder="例如: https://docs.google.com/spreadsheets/d/1DZHybaFPoqUccwXFc2TI549dRT8jk-AECTaCGd4k6W8/edit?usp=sharing"
                  value={googleSheetsUrl}
                  onChange={(e) => onUpdateSheetUrl(e.target.value)}
                  className="flex-1 p-2.5 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500"
                />
                <button
                  type="button"
                  onClick={() => onFetchCloudSheet(googleSheetsUrl)}
                  className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm transition flex items-center justify-center space-x-1.5 cursor-pointer text-xs shrink-0"
                >
                  <Icon name="cloud" className="w-4 h-4" />
                  <span>載入 Google 雲端成績與錯題</span>
                </button>
              </div>
              <p className="text-[11px] text-slate-500">
                💡 <strong>貼心機制：</strong>系統在載入後會<strong>先產生並展示過去的成績與錯題</strong>，供您逐題審閱確認，確認後才開始測驗！
              </p>
            </div>
          </div>
        </div>
      );
    }

              <button

            {reviewTab === 'questions' ? (
              <div className="space-y-2.5 max-h-[60vh] overflow-y-auto pr-1">

                        <div className="text-emerald-700 font-semibold">標準答案：{q.rawCorrectAns || 'A'}</div>

                      <p className="text-[10px] text-slate-500 pt-1 border-t"><strong>解析：</strong>{q.explanation}</p>

            ) : (
              <div className="space-y-2 max-h-[60vh] overflow-y-auto">
                {data.scores.length === 0 ? (
                  <div className="text-center py-10 bg-slate-50 rounded-xl text-slate-400">
                    試算表中無過往成績記錄
                  </div>
                ) : (
                  <table className="w-full text-left border-collapse text-xs">
                    <thead className="bg-slate-100 border-b font-bold text-slate-600">
                      <tr>
                        <th className="p-2.5">測驗時間</th>
                        <th className="p-2.5">考卷名稱</th>
                        <th className="p-2.5">實得分數</th>
                        <th className="p-2.5">答對率</th>
                        <th className="p-2.5">耗時</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {data.scores.map(s => (
                        <tr key={s.id} className="hover:bg-slate-50">
                          <td className="p-2.5 text-slate-500">{s.date}</td>
                          <td className="p-2.5 font-bold text-slate-800">{s.examTitle}</td>
                          <td className="p-2.5 font-bold text-blue-600">{s.score} / {s.totalPoints}</td>
                          <td className="p-2.5 font-bold text-emerald-600">{s.accuracyRate}</td>

            )}
          </div>
        </div>
      );
    }

    function ActiveExamView({ exam, answers, timeLeft, onSelectOption, onSubmit }) {
      const [qIdx, setQIdx] = useState(0);
      const questions = exam.questions || [];
      const currentQ = questions[qIdx] || questions[0];

      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;

      return (
        <div className="space-y-3 max-w-3xl mx-auto w-full">
          <div className="bg-slate-900 text-white p-3 rounded-lg flex items-center justify-between border border-slate-700 shadow-md">
            <div>
              <span className="text-[10px] bg-blue-600 px-2 py-0.5 rounded font-bold">檢定應試中</span>
              <h3 className="font-bold text-sm">{exam.title}</h3>
            </div>
            <div className="flex items-center space-x-3">
              <span className="font-mono font-bold text-amber-400 text-sm">
                ⏱ {mins < 10 ? '0' + mins : mins}:{secs < 10 ? '0' + secs : secs}
              </span>
              <button onClick={onSubmit} className="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded cursor-pointer">
                提前交卷
              </button>
            </div>
          </div>

          <div className="bg-white p-5 rounded-xl border border-slate-300 space-y-4 shadow-sm">
            <div className="flex justify-between text-slate-400 font-bold text-[11px]">
              <span>第 {qIdx + 1} 題 / 共 {questions.length} 題</span>
              <span>配分 {currentQ?.points || 10} 分</span>
            </div>

            <h4 className="font-bold text-slate-800 text-sm">{currentQ?.title}</h4>

            <div className="space-y-2 pt-2">
              {currentQ?.options.map((opt, oIdx) => {
                const isSelected = answers[currentQ.id] === oIdx;
                return (
                  <div
                    key={oIdx}
                    onClick={() => onSelectOption(currentQ.id, oIdx)}
                    className={`p-2.5 rounded-lg border cursor-pointer font-bold transition flex items-center space-x-2 ${
                      isSelected ? 'bg-blue-50 border-blue-600 text-blue-800 ring-1 ring-blue-500' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                    }`}
                  >
                    <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-600'}`}>
                      {String.fromCharCode(65 + oIdx)}
                    </span>
                    <span>{opt}</span>
                  </div>
                );
              })}
            </div>

            <div className="flex justify-between pt-4 border-t">
              <button disabled={qIdx === 0} onClick={() => setQIdx(qIdx - 1)} className="px-3 py-1.5 bg-slate-200 disabled:opacity-40 rounded font-bold cursor-pointer">
                ← 上一題
              </button>
              {qIdx < questions.length - 1 ? (
                <button
                  onClick={() => setQIdx(qIdx + 1)}
                  className="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold cursor-pointer transition shadow-xs"
                >
                  下一題 →
                </button>
              ) : (
                <button
                  onClick={onSubmit}
                  className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-bold cursor-pointer transition shadow-md flex items-center space-x-1"
                >
                  <span>完成交卷 ✓</span>
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function ExamResultView({
      result,
      currentUser,
      googleSheetsUrl,
      onUpdateSheetUrl,
      onRetryExam,
      onPracticeWrong,
      onGoNav,
      showToast
    }) {
      const wrongList = (result.questionSnapshots || []).filter(q => result.userAnswers[q.id] !== q.correctAnswer);
      const wrongCount = wrongList.length;
      const [isAutoSyncing, setIsAutoSyncing] = useState(false);
      const [syncSuccessMsg, setSyncSuccessMsg] = useState('');
      const [showSetupGuide, setShowSetupGuide] = useState(false);

      const copyToClipboard = (text, successMsg) => {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-9999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(textArea);
          if (successful) {
            showToast(successMsg, 'success');
          } else {
            showToast('複製失敗，請手動複製', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('複製失敗，請手動選取複製', 'error');
        }
      };

      const gasCodeSnippet = `function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  // 1. 自動寫入【錯題 (分頁一)】
  var sheetWrong = ss.getSheetByName("錯題") || ss.getSheetByName("分頁一") || ss.insertSheet("錯題");
  if (sheetWrong.getLastRow() === 0) {
    sheetWrong.appendRow(["編號", "試卷名稱", "題目內容", "學員選擇", "標準答案", "題目解析", "記錄時間"]);
  }
  if (data.wrongList && data.wrongList.length > 0) {
    data.wrongList.forEach(function(item) {
      sheetWrong.appendRow([item.idx, item.examTitle, item.title, item.userAnswer, item.correctAnswer, item.explanation, data.date]);
    });
  } else {
    sheetWrong.appendRow(["-", data.examTitle, "本次測驗全對，無錯題", "-", "-", "-", data.date]);
  }

  // 2. 自動寫入【成績 (分頁二)】
  var sheetScore = ss.getSheetByName("成績") || ss.getSheetByName("分頁二") || ss.insertSheet("成績");
  if (sheetScore.getLastRow() === 0) {
    sheetScore.appendRow(["學員姓名", "測驗時間", "測驗試卷", "實得分數", "總分", "答對率", "作答耗時", "錯題總數"]);
  }
  sheetScore.appendRow([data.studentName, data.date, data.examTitle, data.score, data.totalPoints, data.accuracyRate, data.timeSpent, data.wrongCount]);

  return ContentService.createTextOutput(JSON.stringify({ status: "success" })).setMimeType(ContentService.MimeType.JSON);
}`;

      const handleTriggerAutoWrite = async () => {
        if (!googleSheetsUrl || !googleSheetsUrl.trim()) {
          showToast('請先貼上 Google 試算表連結！', 'error');
          return;
        }

        setIsAutoSyncing(true);
        setSyncSuccessMsg('');

        const payload = {
          studentName: currentUser?.name || '檢定學員',
          date: result.date,
          examTitle: result.examTitle,
          score: result.score,
          totalPoints: result.totalPoints,
          accuracyRate: result.accuracyRate,
          timeSpent: result.timeSpent,
          wrongCount: wrongCount,
          wrongList: wrongList.map((q, idx) => ({
            idx: idx + 1,
            examTitle: result.examTitle,
            title: q.title,
            userAnswer: q.options[result.userAnswers[q.id]] !== undefined ? `${String.fromCharCode(65 + result.userAnswers[q.id])}. ${q.options[result.userAnswers[q.id]]}` : '未作答',
            correctAnswer: `${String.fromCharCode(65 + q.correctAnswer)}. ${q.options[q.correctAnswer]}`,
            explanation: q.explanation || '無'
          }))
        };

        try {
          await fetch(googleSheetsUrl.trim(), {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          setTimeout(() => {
            setIsAutoSyncing(false);
            setSyncSuccessMsg('🎉 成功！系統已將「錯題 (分頁一)」與「成績 (分頁二)」同步至雲端！');
            showToast('✅ 已成功將成果同步至 Google 試算表！', 'success');
          }, 1200);
        } catch (error) {
          console.error(error);
          setIsAutoSyncing(false);
          showToast('寫入過程遇到問題，請確認該網址具有存取權限。', 'error');
        }
      };

      return (
        <div className="space-y-4 max-w-4xl mx-auto pb-8">
          <div className="bg-white p-5 rounded-xl border border-slate-300 shadow-sm space-y-4 text-center">
            <div className="inline-flex items-center space-x-1.5 px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full font-bold text-xs">
              <span>✓ 測驗完成與即時自動批改</span>
            </div>
            <h2 className="text-lg font-bold text-slate-800">{result.examTitle}</h2>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-2xl mx-auto">
              <div className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                <p className="text-slate-400 text-[10px] font-bold">實得分數</p>
                <p className="text-xl font-black text-blue-600">{result.score} <span className="text-xs text-slate-400 font-normal">/ {result.totalPoints}</span></p>
              </div>
              <div className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                <p className="text-slate-400 text-[10px] font-bold">答對率</p>
                <p className="text-xl font-black text-emerald-600">{result.accuracyRate}</p>
              </div>
              <div className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                <p className="text-slate-400 text-[10px] font-bold">錯題數量</p>
                <p className="text-xl font-black text-rose-600">{wrongCount} <span className="text-xs text-slate-400 font-normal">題</span></p>
              </div>
              <div className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                <p className="text-slate-400 text-[10px] font-bold">作答耗時</p>
                <p className="text-xl font-black text-slate-700">{result.timeSpent}</p>
              </div>
            </div>

            <div className="flex flex-wrap justify-center gap-2 pt-2">
              {wrongCount > 0 && (
                <button
                  onClick={onPracticeWrong}
                  className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg shadow-sm transition flex items-center space-x-1 cursor-pointer"
                >
                  <span>🎯 一鍵啟動錯題再次練習 ({wrongCount} 題)</span>
                </button>
              )}
              <button
                onClick={() => exportResultToTwoSheetsExcel(result, currentUser?.name || '學員')}
                className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm transition flex items-center space-x-1 cursor-pointer"
              >
                <Icon name="download" />
                <span>下載雙分頁 Excel (錯題+成績)</span>
              </button>
              <button
                onClick={onRetryExam}
                className="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm transition flex items-center space-x-1 cursor-pointer"
              >
                <Icon name="refresh" />
                <span>重新測驗</span>
              </button>
              <button
                onClick={onGoNav}
                className="px-3.5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg transition cursor-pointer"
              >
                <span>返回流程圖選單</span>
              </button>
            </div>
          </div>

          {/* Sync Box */}
          <div className="bg-white p-4 sm:p-5 rounded-xl border-2 border-blue-400 shadow-md space-y-3.5">
            <div className="flex items-center justify-between border-b pb-2.5">
              <div className="flex items-center space-x-2">
                <span className="p-2 bg-blue-600 text-white rounded-lg">
                  <Icon name="cloud" className="w-5 h-5" />
                </span>
                <div>
                  <h3 className="font-bold text-slate-800 text-sm">Google 雲端試算表自動同步寫入</h3>
                  <p className="text-[11px] text-slate-500">將本次測驗的「錯題 (分頁一)」與「成績 (分頁二)」同步至雲端試算表</p>
                </div>
              </div>
              <button
                type="button"
                onClick={() => setShowSetupGuide(!showSetupGuide)}
                className="px-3 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-300 rounded-lg text-xs font-bold transition flex items-center space-x-1 cursor-pointer"
              >
                <span>{showSetupGuide ? '收起設定說明 ▲' : '📖 4步驟設定教學 (點此展開) ▼'}</span>
              </button>
            </div>

            <div className="space-y-2">
              <div className="flex flex-col sm:flex-row gap-2">
                <input
                  type="text"
                  placeholder="在此貼上 Google 試算表 Web App 網址或共用連結"
                  value={googleSheetsUrl}
                  onChange={(e) => onUpdateSheetUrl(e.target.value)}
                  className="flex-1 p-2.5 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500"
                />
                <button
                  type="button"
                  onClick={handleTriggerAutoWrite}
                  disabled={isAutoSyncing || !googleSheetsUrl.trim()}

                >
                  {isAutoSyncing ? <span>同步中...</span> : <span>🚀 立即寫入 Google 試算表</span>}
                </button>
              </div>
            </div>

            {/* Step-by-Step Guidance Box */}
            {showSetupGuide ? (
              <div className="p-4 bg-slate-50 border border-slate-300 rounded-xl space-y-3 text-xs leading-relaxed">
                <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                  <span className="font-bold text-slate-800 flex items-center space-x-1.5">
                    <span className="text-base">📋</span>
                    <span className="text-sm">Google 試算表自動寫入設定指南（只需設定一次）</span>
                  </span>
                  <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded">免帳號授權</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-[11px]">
                  <div className="p-2.5 bg-white rounded-lg border border-slate-200 space-y-1">
                    <div className="font-bold text-blue-700 flex items-center space-x-1">
                      <span className="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px]">1</span>
                      <span>建立 Google 試算表</span>
                    </div>
                    <p className="text-slate-600 pl-6">
                      前往您的 Google Drive 建立一個空白試算表，命名為任意名稱。
                    </p>
                  </div>

                  <div className="p-2.5 bg-white rounded-lg border border-slate-200 space-y-1">
                    <div className="font-bold text-blue-700 flex items-center space-x-1">
                      <span className="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px]">2</span>
                      <span>開啟 Apps Script 編輯器</span>
                    </div>
                    <p className="text-slate-600 pl-6">
                      在試算表上方選單點選 <strong>「擴充功能」➔「Apps Script」</strong>。
                    </p>
                  </div>

                  <div className="p-2.5 bg-white rounded-lg border border-slate-200 space-y-1.5 md:col-span-2">
                    <div className="flex items-center justify-between">
                      <div className="font-bold text-blue-700 flex items-center space-x-1">
                        <span className="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px]">3</span>
                        <span>貼上接收程式碼並存檔</span>
                      </div>
                      <button
                        type="button"
                        onClick={() => copyToClipboard(gasCodeSnippet, '✅ 已成功複製 Apps Script 接收程式碼！')}
                        className="px-2.5 py-1 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded shadow-xs cursor-pointer flex items-center space-x-1 text-[11px]"
                      >
                        <Icon name="copy" className="w-3.5 h-3.5" />
                        <span>一鍵複製【專屬接收程式碼】</span>
                      </button>
                    </div>
                    <p className="text-slate-600 pl-6">
                      清空 Apps Script 中的預設內容，點擊上方按鈕複製代碼並貼入，最後點選 💾「儲存專案」。
                    </p>
                  </div>

                  <div className="p-2.5 bg-white rounded-lg border border-slate-200 space-y-1 md:col-span-2">
                    <div className="font-bold text-blue-700 flex items-center space-x-1">
                      <span className="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px]">4</span>
                      <span>部署為網頁應用程式 (Web App)</span>
                    </div>
                    <p className="text-slate-600 pl-6">
                      點擊右上角 <strong>「部署」➔「新增部署作業」</strong> ➔ 齒輪圖示選 <strong>「網頁應用程式」</strong> ➔ 將「誰可以存取」設為 <strong>「所有人 (Anyone)」</strong> ➔ 點擊「部署」並複製產生的 <code>https://script.google.com/macros/s/.../exec</code> 網址貼回上方欄位即可！
                    </p>
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex items-center justify-between p-2.5 bg-blue-50/60 rounded-lg border border-blue-200 text-[11px] text-blue-900">
                <div className="flex items-center space-x-2">
                  <span className="text-sm">💡</span>
                  <span>不知道如何取得網址？點選右方展開 4 步驟設定教學與程式碼！</span>
                </div>
                <button
                  type="button"
                  onClick={() => setShowSetupGuide(true)}
                  className="font-bold text-blue-700 hover:underline cursor-pointer shrink-0 ml-2"
                >
                  查看教學 ➔

              <div className="p-3 rounded-lg bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-bold flex items-center space-x-2">
                <span>✓</span>
                <span>{syncSuccessMsg}</span>
              </div>
            )}
          </div>

          {wrongCount > 0 && (
            <div className="bg-white p-4 rounded-xl border border-slate-300 shadow-sm space-y-3">
              <h3 className="font-bold text-slate-800 text-xs border-b pb-2">本次測驗答錯題目清單 ({wrongCount} 題)：</h3>
              <div className="space-y-2.5">
                {wrongList.map((q, idx) => (
                  <div key={q.id} className="p-3 rounded-lg border border-rose-200 bg-rose-50/40 space-y-1.5 text-xs">
                    <div className="font-bold text-rose-900">{idx + 1}. {q.title}</div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-1 text-[11px] pt-1">
                      <div className="text-rose-700 font-semibold">
                        學員選擇：{q.options[result.userAnswers[q.id]] !== undefined ? `${String.fromCharCode(65 + result.userAnswers[q.id])}. ${q.options[result.userAnswers[q.id]]}` : '未作答'} ✗
                      </div>
                      <div className="text-emerald-700 font-semibold">
                        標準答案：{String.fromCharCode(65 + q.correctAnswer)}. {q.options[q.correctAnswer]} ✓
                      </div>
                    </div>
                    {q.explanation && (
                      <p className="text-[10px] text-slate-500 pt-1 border-t border-rose-100">
                        <strong>題目解析：</strong>{q.explanation}
                      </p>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function LearningHistoryView({ history, currentUser, onPracticeWrong }) {
      const [chartMetric, setChartMetric] = useState('score');

      const chartData = useMemo(() => {
        return [...history].reverse().map(item => {
          let numAcc = 0;
          if (item.accuracyRate) {
            const raw = String(item.accuracyRate).replace('%', '');
            numAcc = parseFloat(raw) || 0;
          }
          return {
            title: item.examTitle,
            date: item.date,
            score: Number(item.score) || 0,
            accuracy: numAcc
          };
        });
      }, [history]);

      const stats = useMemo(() => {
        if (chartData.length === 0) return { avgScore: 0, highest: 0, latestDelta: 0 };
        const total = chartData.reduce((sum, d) => sum + d.score, 0);
        const avg = Math.round(total / chartData.length);
        const max = Math.max(...chartData.map(d => d.score));
        let delta = 0;
        if (chartData.length >= 2) {
          delta = chartData[chartData.length - 1].score - chartData[chartData.length - 2].score;
        }
        return { avgScore: avg, highest: max, latestDelta: delta };
      }, [chartData]);

      return (
        <div className="space-y-4 max-w-5xl mx-auto w-full">
          <div className="bg-white p-4 rounded-xl border border-slate-300 shadow-xs flex items-center justify-between">
            <div>
              <h2 className="font-bold text-slate-800 text-sm">
                個人學習與檢定紀錄
              </h2>
              <p className="text-[11px] text-slate-500">查閱歷次測驗成果、折線圖表分析與弱點追蹤</p>
            </div>
          </div>

          {history.length === 0 ? (
            <div className="bg-white p-12 rounded-xl border border-dashed border-slate-300 text-center space-y-3 shadow-xs">
              <div className="w-12 h-12 mx-auto rounded-full bg-slate-100 text-slate-400 flex items-center justify-center text-xl font-bold">
                📊
              </div>
              <div className="space-y-1">
                <h3 className="font-bold text-slate-700 text-sm">目前尚無個人測驗紀錄</h3>
                <p className="text-xs text-slate-400 max-w-md mx-auto">
                  您尚未進行任何線上測驗或載入雲端試算表。請至「線上題庫區」或「自訂題庫區」完成測驗，歷次得分趨勢與答對率圖表將在此處為您即時統計呈現。
                </p>
              </div>
            </div>
          ) : (
            <>
              {/* VISUAL CHART SECTION */}
              <div className="bg-white p-5 rounded-xl border border-slate-300 shadow-xs space-y-4">
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 border-b pb-3">
                  <div className="flex items-center space-x-2">
                    <span className="p-1.5 bg-blue-100 text-blue-700 rounded-lg">
                      <Icon name="chart" className="w-5 h-5" />
                    </span>
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm">學習成效與進步趨勢圖表</h3>
                      <p className="text-[11px] text-slate-500">視覺化呈現歷次測驗成績起伏與成長軌跡</p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-2">
                    <span className={`px-2.5 py-1 rounded-full text-xs font-bold border ${
                      stats.latestDelta >= 0 ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-rose-50 text-rose-700 border-rose-300'
                    }`}>
                      {stats.latestDelta >= 0 ? `📈 較前次進步 +${stats.latestDelta} 分` : `📉 較前次退步 ${stats.latestDelta} 分`}
                    </span>

                    <div className="flex bg-slate-100 p-0.5 rounded-lg border text-xs">
                      <button
                        type="button"
                        onClick={() => setChartMetric('score')}
                        className={`px-3 py-1 rounded-md font-bold transition cursor-pointer ${
                          chartMetric === 'score' ? 'bg-white text-blue-700 shadow-xs' : 'text-slate-600'
                        }`}
                      >
                        分數趨勢
                      </button>
                      <button
                        type="button"
                        onClick={() => setChartMetric('accuracy')}
                        className={`px-3 py-1 rounded-md font-bold transition cursor-pointer ${
                          chartMetric === 'accuracy' ? 'bg-white text-blue-700 shadow-xs' : 'text-slate-600'
                        }`}
                      >
                        答對率 (%)
                      </button>
                    </div>
                  </div>
                </div>

                {/* Stat Cards */}
                <div className="grid grid-cols-3 gap-3">
                  <div className="p-3 bg-slate-50 rounded-lg border text-center">
                    <span className="text-[10px] text-slate-400 font-bold">歷史最高得分</span>
                    <p className="text-xl font-black text-blue-600 mt-0.5">{stats.highest} 分</p>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-lg border text-center">
                    <span className="text-[10px] text-slate-400 font-bold">平均測驗得分</span>
                    <p className="text-xl font-black text-slate-700 mt-0.5">{stats.avgScore} 分</p>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-lg border text-center">
                    <span className="text-[10px] text-slate-400 font-bold">累計完成測驗</span>
                    <p className="text-xl font-black text-emerald-600 mt-0.5">{chartData.length} 次</p>
                  </div>
                </div>

                {/* Responsive SVG Line Chart */}
                <div className="relative pt-4">
                  <svg viewBox="0 0 500 150" className="w-full h-44 overflow-visible">
                    <line x1="0" y1="20" x2="500" y2="20" stroke="#f1f5f9" strokeDasharray="3 3" />
                    <line x1="0" y1="65" x2="500" y2="65" stroke="#f1f5f9" strokeDasharray="3 3" />
                    <line x1="0" y1="110" x2="500" y2="110" stroke="#f1f5f9" strokeDasharray="3 3" />

                    {chartData.length > 1 && (
                      <>
                        <defs>
                          <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#3b82f6" stopOpacity="0.3" />
                            <stop offset="100%" stopColor="#3b82f6" stopOpacity="0.0" />
                          </linearGradient>
                        </defs>
                        <polygon
                          fill="url(#chartGrad)"
                          points={`
                            0,130
                            ${chartData.map((d, i) => {
                              const x = (i / (chartData.length - 1)) * 480 + 10;
                              const val = chartMetric === 'score' ? d.score : d.accuracy;
                              const maxVal = chartMetric === 'score' ? Math.max(50, stats.highest) : 100;
                              const y = 130 - (val / (maxVal || 1)) * 100;
                              return `${x},${y}`;
                            }).join(' ')}
                            500,130
                          `}
                        />
                        <polyline
                          fill="none"
                          stroke="#2563eb"
                          strokeWidth="3"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          points={chartData.map((d, i) => {
                            const x = (i / (chartData.length - 1)) * 480 + 10;
                            const val = chartMetric === 'score' ? d.score : d.accuracy;
                            const maxVal = chartMetric === 'score' ? Math.max(50, stats.highest) : 100;
                            const y = 130 - (val / (maxVal || 1)) * 100;
                            return `${x},${y}`;
                          }).join(' ')}
                        />
                      </>
                    )}

                    {chartData.map((d, i) => {
                      const x = chartData.length > 1 ? (i / (chartData.length - 1)) * 480 + 10 : 250;
                      const val = chartMetric === 'score' ? d.score : d.accuracy;
                      const maxVal = chartMetric === 'score' ? Math.max(50, stats.highest) : 100;
                      const y = 130 - (val / (maxVal || 1)) * 100;
                      return (
                        <g key={i}>
                          <circle cx={x} cy={y} r="5" fill="#2563eb" stroke="#ffffff" strokeWidth="2" />
                          <text x={x} y={y - 8} fontSize="9" fill="#1e40af" fontWeight="bold" textAnchor="middle">
                            {chartMetric === 'score' ? `${d.score}分` : `${d.accuracy}%`}
                          </text>
                          <text x={x} y="145" fontSize="8" fill="#94a3b8" textAnchor="middle">
                            第{i + 1}次
                          </text>
                        </g>
                      );
                    })}
                  </svg>
                </div>
              </div>

              {/* Data Table */}
              <div className="bg-white rounded-xl border border-slate-300 overflow-hidden shadow-xs">
                <table className="w-full text-left border-collapse text-xs">
                  <thead className="bg-slate-100 border-b font-bold text-slate-600">
                    <tr>
                      <th className="p-3">測驗時間</th>
                      <th className="p-3">考卷名稱</th>
                      <th className="p-3">得分 / 總分</th>
                      <th className="p-3">答對率</th>
                      <th className="p-3 text-right">錯題練習</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {history.map(item => (
                      <tr key={item.id} className="hover:bg-slate-50">
                        <td className="p-3 text-slate-500 font-mono text-[11px]">{item.date}</td>
                        <td className="p-3 font-bold text-slate-800">{item.examTitle}</td>
                        <td className="p-3 font-bold text-blue-600">{item.score} / {item.totalPoints}</td>
                        <td className="p-3 font-bold text-emerald-600">{item.accuracyRate}</td>
                        <td className="p-3 text-right">
                          <button
                            onClick={() => onPracticeWrong(item)}
                            className="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded cursor-pointer transition shadow-xs"
                          >
                            錯題再練習
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}
        </div>
      );
    }

    function AdminPanelView({ questions, categories, usersList, currentUser, onAddUser, onUpdateUser, onDeleteUser }) {
      const [showUserModal, setShowUserModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [userName, setUserName] = useState('');
      const [userEmail, setUserEmail] = useState('');
      const [userRole, setUserRole] = useState('STUDENT');

      const handleOpenAddUser = () => {
        setEditingUser(null);
        setUserName('');
        setUserEmail('');
        setUserRole('STUDENT');
        setShowUserModal(true);
      };

      const handleOpenEditUser = (u) => {
        setEditingUser(u);
        setUserName(u.name);
        setUserEmail(u.email);
        setUserRole(u.role);
        setShowUserModal(true);
      };

      const handleSaveUser = (e) => {
        e.preventDefault();
        const roleTitle = userRole === 'ADMIN' ? '全站系統管理員' : '一般檢定學員';
        if (editingUser) {
          onUpdateUser({
            ...editingUser,
            name: userName,
            email: userEmail,
            role: userRole,
            roleTitle
          });
        } else {
          onAddUser({
            id: 'usr-' + Date.now(),
            name: userName,
            email: userEmail,
            role: userRole,
            roleTitle
          });
        }
        setShowUserModal(false);
      };

      return (
        <div className="space-y-4 max-w-5xl mx-auto w-full">
          <div className="bg-white p-4 rounded-xl border border-slate-300 flex items-center justify-between shadow-xs">
            <div>
              <h2 className="font-bold text-slate-800 text-sm">全站帳號與權限管理中心 (管理員專屬 CRUD)</h2>
              <p className="text-[11px] text-slate-500">維護全站學員與管理員帳號名冊、角色指派與權限移除</p>
            </div>
            <button
              onClick={handleOpenAddUser}
              className="px-3.5 py-1.5 bg-purple-700 hover:bg-purple-800 text-white font-bold text-xs rounded-lg transition flex items-center space-x-1 shadow-xs cursor-pointer"
            >
              <Icon name="plus" />
              <span>新增使用者帳號</span>
            </button>
          </div>

          {/* User CRUD Modal */}
          {showUserModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white max-w-sm w-full rounded-2xl shadow-2xl border border-slate-300 p-5 space-y-3.5 text-xs">
                <div className="flex justify-between items-center border-b pb-2 font-bold text-slate-800">
                  <span className="text-sm">{editingUser ? '編輯帳號資料' : '新增使用者帳號'}</span>
                  <button onClick={() => setShowUserModal(false)} className="text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
                </div>
                <form onSubmit={handleSaveUser} className="space-y-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">使用者姓名 *</label>
                    <input
                      type="text"
                      required
                      value={userName}
                      onChange={e => setUserName(e.target.value)}
                      placeholder="例如：王小明"
                      className="w-full p-2 border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">電子郵件 *</label>
                    <input
                      type="email"
                      required
                      value={userEmail}
                      onChange={e => setUserEmail(e.target.value)}
                      placeholder="例如：user@exam.com"
                      className="w-full p-2 border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">身分權限 *</label>
                    <select
                      value={userRole}
                      onChange={e => setUserRole(e.target.value)}
                      className="w-full p-2 border border-slate-300 rounded-lg text-xs"
                    >
                      <option value="STUDENT">一般檢定學員 (STUDENT)</option>
                      <option value="ADMIN">全站系統管理員 (ADMIN)</option>
                    </select>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2 border-t">
                    <button
                      type="button"
                      onClick={() => setShowUserModal(false)}
                      className="px-3.5 py-1.5 bg-slate-200 text-slate-700 rounded-lg font-bold cursor-pointer"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 bg-purple-700 hover:bg-purple-800 text-white font-bold rounded-lg cursor-pointer shadow-xs"
                    >
                      儲存帳號
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* User Table */}
          <div className="bg-white rounded-xl border border-slate-300 overflow-hidden shadow-xs">
            <table className="w-full text-left border-collapse text-xs">
              <thead className="bg-slate-100 border-b font-bold text-slate-600">
                <tr>
                  <th className="p-3">使用者姓名</th>
                  <th className="p-3">電子郵件</th>
                  <th className="p-3">權限類別</th>
                  <th className="p-3 text-right">操作管理</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {usersList.map(u => (
                  <tr key={u.id} className="hover:bg-slate-50">
                    <td className="p-3 font-bold text-slate-800">{u.name}</td>
                    <td className="p-3 text-slate-500">{u.email}</td>
                    <td className="p-3">
                      <span className={`px-2.5 py-0.5 rounded font-bold text-[10px] ${
                        u.role === 'ADMIN' ? 'bg-purple-100 text-purple-800 border border-purple-200' : 'bg-blue-100 text-blue-800 border border-blue-200'
                      }`}>
                        {u.roleTitle}
                      </span>
                    </td>
                    <td className="p-3 text-right space-x-1.5">
                      <button
                        onClick={() => handleOpenEditUser(u)}
                        className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border rounded font-semibold cursor-pointer"
                      >
                        編輯
                      </button>
                      <button
                        onClick={() => onDeleteUser(u.id)}
                        className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded font-semibold cursor-pointer"
                      >
                        移除
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
